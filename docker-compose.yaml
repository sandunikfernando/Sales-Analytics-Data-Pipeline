x-airflow-common:
  &airflow-common
  build: .
  env_file:
    - .env
  environment: 
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0

    AIRFLOW__CELERY__WORKER_CONCURRENCY: 2
    AIRFLOW__CELERY__WORKER_PREFETCH_MULTIPLIER: 1

    AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: 8793


    AIRFLOW__CELERY__WORKER_HIJACK_ROOT_LOGGER: "False"


    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "true"

    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    PYTHONPATH: "/opt/airflow"

    AIRFLOW__SMTP__SMTP_HOST: smtp.gmail.com
    AIRFLOW__SMTP__SMTP_STARTTLS: "True"
    AIRFLOW__SMTP__SMTP_SSL: "False"
    AIRFLOW__SMTP__SMTP_PORT: 587
    AIRFLOW__SMTP__SMTP_MAIL_FROM: sandunifdo28@gmail.com
    AIRFLOW__SMTP__SMTP_USER: sandunifdo28@gmail.com
    AIRFLOW__SMTP__SMTP_PASSWORD: REMOVED

  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/scripts:/opt/airflow/scripts
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/retail_sales_dbt:/opt/airflow/dbt/retail_sales_dbt

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy


services:

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always


  redis:
    image: redis:7.2-bookworm
    expose:
      - 6379
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s


  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-worker:
    <<: *airflow-common

    # ✅ FIXED WORKER COMMAND
    # command: airflow celery worker --loglevel=INFO --hostname=airflow@%h
    command: celery worker

    restart: always

    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d 'airflow@airflow-worker' || true"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully


  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
     - -c
     - |
        airflow db migrate
        airflow users create \
          --username airflow \
          --password airflow \
          --firstname airflow \
          --lastname airflow \
          --role Admin \
          --email airflow@example.com || true


  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    command: bash -c "airflow"


volumes:
  postgres-db-volume: