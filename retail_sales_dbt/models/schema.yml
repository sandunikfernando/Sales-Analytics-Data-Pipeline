version: 2

models:

  - name: dim_product

    columns:

      - name: product_id

        tests:
          - unique
          - not_null

  - name: dim_user

    columns:

      - name: user_id

        tests:
          - unique
          - not_null

  - name: fct_cart_items

    columns:

      - name: cart_id

        tests:
          - not_null

      - name: product_id

        tests:
          - relationships:
              to: ref('dim_product')
              field: product_id
